; Default 128M is too small for parsing large TSM files and the feature suite.
memory_limit = 512M
; Everything is stored and computed in UTC; users get their own timezone at display time.
date.timezone = UTC
; Uploads of TradeSkillMaster.lua. Keep in step with ledger.ingest.max_request_bytes and the
; nginx client_max_body_size for the upload paths.
post_max_size = 50M
upload_max_filesize = 50M
