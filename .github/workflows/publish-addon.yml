name: Publish addon to CurseForge

# Run by hand from the Actions tab (choose the release type), or push a tag like addon-v0.2.0.
# Builds the reproducible addon zip, then uploads it with scripts/publish-curseforge.sh.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
on:
  workflow_dispatch:
    inputs:
      type:
        description: Release type
        type: choice
        options: [release, beta, alpha]
        default: release
  push:
    tags: ['addon-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Addon tests
        run: sh addon/tests/run.sh

      - name: Build the addon zip
        run: sh scripts/build-addon.sh

      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CF_API_KEY }}
          CURSEFORGE_PROJECT_ID: '1783753'
          GAME_VERSIONS: '12.1.5,1.60.1'
        run: sh scripts/publish-curseforge.sh "${{ inputs.type || 'release' }}"
